<!doctype html><html><head><meta charset="utf-8"><script src="icons.js"></script><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1175px;height:330px;background:#090513;color:#F8F3FF;font-family:"Hiragino Sans",sans-serif;overflow:hidden}
.card{position:absolute;top:10px;width:370px;height:310px;border-radius:18px;background:linear-gradient(180deg,#1a1030,#120a20);border:1.5px solid #5D387F;padding:26px 26px}
.card.hot{border-color:#FF72ED;box-shadow:0 0 26px rgba(255,114,237,.25)}
.no{font-size:12px;font-weight:800;letter-spacing:2px;color:#FF72ED}
.ic{width:62px;height:62px;border-radius:16px;background:#22143a;border:1.5px solid #9C58D2;display:flex;align-items:center;justify-content:center;margin:14px 0 16px;box-shadow:0 0 18px rgba(201,124,250,.3)}
.ic svg{width:32px;height:32px;fill:none;stroke:#E7D4F6;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.h{font-size:24px;font-weight:800;line-height:1.35}
.h em{font-style:normal;color:#FF72ED}
.p{font-size:14px;color:#B9A8D0;line-height:1.7;margin-top:12px}
</style></head><body>
<div class="card" style="left:0"><div class="no">01</div><div class="ic"><svg viewBox="0 0 24 24" id="a"></svg></div><div class="h">案が<em>あふれて</em>、<br>選べなかった</div><div class="p">AI に聞くほど案は増える。<br>でも、比べきれないまま埋もれていく。</div></div>
<div class="card" style="left:402px"><div class="no">02</div><div class="ic"><svg viewBox="0 0 24 24" id="b"></svg></div><div class="h">「こういうのがいい」が<br><em>流れて消えた</em></div><div class="p">モヤモヤした好みや違和感はあるのに、<br>言葉にならないまま次の話題へ。</div></div>
<div class="card hot" style="left:805px"><div class="no">03</div><div class="ic"><svg viewBox="0 0 24 24" id="c"></svg></div><div class="h">メンバーで<br><em>意思をそろえにくい</em></div><div class="p">誰が何を良いと思っているのか、<br>どこまで合意したのかが見えない。</div></div>
<script>a.innerHTML=ICONS['layers'];b.innerHTML=ICONS['cloud-fog'];c.innerHTML=ICONS['users-round'];</script>
</body></html>
