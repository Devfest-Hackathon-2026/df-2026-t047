<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1672px; height: 941px; margin: 0; overflow: hidden; background: radial-gradient(circle at 72% 60%,#281044,#090513 63%); }
    body { font-family: "Hiragino Sans", "Yu Gothic", sans-serif; color: white; }
    .header { position: absolute; left: 58px; top: 35px; font-size: 22px; letter-spacing: 3px; font-weight: 800; }
    .line { position: absolute; left: 58px; right: 112px; top: 88px; height: 2px; background: linear-gradient(90deg,#ff72ed,#8d4be8 70%,transparent); }

    h1 { position: absolute; left: 60px; top: 116px; margin: 0; font-size: 58px; line-height: 1.15; font-style: italic; }

    .shot { position: absolute; left: 60px; top: 302px; width: 930px; height: 564px; border: 2px dashed #b86adb; border-radius: 24px; display: grid; place-items: center; background: rgba(23,9,39,.82); box-shadow: inset 0 0 65px rgba(134,53,184,.18); text-align: center; color: #c8addb; }
    .shot b { display:block; font-size: 30px; color: #f3ddff; margin-bottom: 12px; }
    .shot span { font-size: 18px; line-height: 1.7; }
    .items { position: absolute; left: 1030px; right: 60px; top: 302px; display: grid; gap: 14px; }
    .card { padding: 18px 22px; border: 1px solid #75459a; border-radius: 14px; background: rgba(28,12,47,.88); font-size: 20px; font-weight: 700; }
    .terminal { color: #75efad; background: #06110c; font-family: Menlo, monospace; }
    .tag { position:absolute; right:60px; bottom:52px; color:#bca8ce; font-size:16px; }
  </style>
</head>

  <div class="header">IDEA AUDITION — OPEN SOURCE</div><div class="line"></div><div class="page">13</div>

  </div>

</html>
