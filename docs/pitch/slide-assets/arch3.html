<!doctype html><html><head><meta charset="utf-8"><script src="icons.js"></script><script src="brands.js"></script><style>
:root{--bg:#0b0716;--pink:#FF72ED;--violet:#C97CFA;--green:#5be3b0;--blue:#7cc4ff;--text:#F8F3FF;--muted:#B9A8D0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1250px;height:655px;overflow:hidden;color:var(--text);font-family:"Hiragino Sans",sans-serif;
background-color:var(--bg);background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:16px 16px}
.zone{position:absolute;border:1.4px dashed #4b3670;border-radius:14px}
.zone.solid{border-style:solid;border-color:#5a4590;background:#ffffff04}
.zl{position:absolute;font-size:11px;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;gap:5px}
.tile{position:absolute;width:140px;margin-left:-70px;text-align:center}
.ic{width:50px;height:50px;margin:0 auto;border-radius:12px;background:#f7f3fc;border:1.4px solid #4d3570;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px #0008}
.ic img{width:34px;height:34px;object-fit:contain}.ic svg{width:28px;height:28px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nm{font-size:11.5px;font-weight:800;margin-top:5px;line-height:1.25}
.sb{font-size:8.6px;color:var(--muted);margin-top:2px;line-height:1.35;font-family:"SF Mono",Menlo,monospace}
.chip{position:absolute;font-size:9.5px;font-weight:700;padding:5px 7px;border-radius:8px;background:#1a1129;border:1px solid #4d3570;text-align:center;white-space:nowrap}
.lb{position:absolute;font-size:8.8px;font-family:"SF Mono",Menlo,monospace;padding:1px 4px;border-radius:4px;background:var(--bg);white-space:nowrap}
</style></head><body>
<div id="z"></div><svg id="s" width="1250" height="655" style="position:absolute;left:0;top:0"></svg><div id="t"></div>

const C={pink:'#FF72ED',violet:'#C97CFA',green:'#5be3b0',blue:'#7cc4ff',gray:'#9b8bb5',gold:'#ffcf6b'};
const Z=document.getElementById('z'),T=document.getElementById('t'),S=document.getElementById('s');
function zone(x,y,w,h,label,color,solid,bottom){Z.insertAdjacentHTML('beforeend',`<div class="zone ${solid?'solid':''}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;${color?'border-color:'+color+'88':''}"></div><div class="zl" style="left:${x+12}px;top:${bottom?y+h-20:y+8}px;color:${color||'#a993cf'}">${label}</div>`)}
function inner(icon,color){if(icon.startsWith('img:'))return `<img src="logos/${icon.slice(4)}">`;if(icon.startsWith('brand:')){const[,n,c]=icon.split(':');return `<svg viewBox="0 0 24 24" style="fill:#${c};stroke:none"><path d="${BRANDS[n]}"/></svg>`}return `<svg viewBox="0 0 24 24" style="stroke:#3b2160">${ICONS[icon]}</svg>`}
function tile(x,y,icon,name,sub,color){T.insertAdjacentHTML('beforeend',`<div class="tile" style="left:${x}px;top:${y-25}px"><div class="ic" style="border-color:${color};box-shadow:0 0 16px ${color}55">${inner(icon,color)}</div><div class="nm">${name}</div><div class="sb">${sub}</div></div>`)}
let mid=0;
function line(pts,color,{label,lx,ly,dash,both}={}){mid++;
 S.insertAdjacentHTML('beforeend',`<defs><marker id="m${mid}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${color}"/></marker></defs><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${color}" stroke-width="1.6" ${dash?'stroke-dasharray="5 4"':''} marker-end="url(#m${mid})" ${both?`marker-start="url(#m${mid})"`:''}/>`);
 if(label)T.insertAdjacentHTML('beforeend',`<div class="lb" style="left:${lx}px;top:${ly}px;color:${color}">${label}</div>`)}
// zones

T.insertAdjacentHTML('beforeend',`<div style="position:absolute;left:112px;top:512px;display:flex;gap:9px;font-size:8.8px;color:#b9a8d0">`+[['#FF72ED','CAMP'],['#C97CFA','Gemini'],['#5be3b0','声'],['#ffcf6b','保存'],['#7cc4ff','HTTP']].map(([c,n])=>`<span style="display:flex;align-items:center;gap:3px"><i style="width:12px;height:2px;background:${c};display:inline-block"></i>${n}</span>`).join('')+`</div>`);
