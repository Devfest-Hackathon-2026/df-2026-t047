<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1672px; height: 941px; margin: 0; overflow: hidden; background: radial-gradient(circle at 70% 60%,#321052,#090513 62%); }
    body { font-family: "Hiragino Sans", "Yu Gothic", sans-serif; color: white; }
    .header { position: absolute; left: 58px; top: 35px; font-size: 22px; letter-spacing: 3px; font-weight: 800; }
    .line { position: absolute; left: 58px; right: 112px; top: 88px; height: 2px; background: linear-gradient(90deg,#ff72ed,#8d4be8 70%,transparent); }
    .page { position: absolute; right: 48px; top: 24px; font: italic 54px "Avenir Next"; color: #c8a9ef; }
    h1 { position: absolute; left: 60px; top: 111px; margin: 0; font-size: 62px; font-style: italic; }
    h1 em { color: #ff72ed; font-style: inherit; text-shadow: 0 0 25px rgba(255,114,237,.55); }
    .frame { position: absolute; left: 80px; right: 80px; top: 228px; bottom: 55px; border: 2px solid #d96cf4; border-radius: 26px; overflow: hidden; box-shadow: 0 0 34px rgba(177,76,255,.5), inset 0 0 45px rgba(9,5,19,.4); background: #11051e; }
    .frame img { width: 100%; height: 100%; object-fit: cover; filter: brightness(.45) saturate(.85); }
    .veil { position: absolute; inset: 0; background: linear-gradient(180deg,rgba(9,5,19,.1),rgba(9,5,19,.55)); }
    .play { position: absolute; left: 50%; top: 48%; transform: translate(-50%,-50%); width: 140px; height: 140px; border-radius: 50%; border: 3px solid #ff9ff2; background: rgba(44,11,68,.82); box-shadow: 0 0 42px #ff72ed99; }
    .play:after { content: ""; position: absolute; left: 54px; top: 37px; border-left: 48px solid white; border-top: 32px solid transparent; border-bottom: 32px solid transparent; }
    .label { position: absolute; left: 0; right: 0; top: 64%; text-align: center; font-size: 29px; font-weight: 900; letter-spacing: 2px; }
    .label small { display: block; margin-top: 10px; font-size: 18px; font-weight: 500; color: #d2bfdf; }
  </style>
</head>
<body>
  <div class="header">IDEA AUDITION — DEMO FIRST</div><div class="line"></div><div class="page">07</div>
  <h1>説明より先に、<em>体験を。</em></h1>
  <div class="frame">
    <img src="../slide-assets/v12/02-buzz-2of4.png" alt="">
    <div class="veil"></div><div class="play"></div>
    <div class="label">DEMO VIDEO — 45 sec<small>完成したプレイ動画を、この枠いっぱいに挿入</small></div>
  </div>
</body>
</html>
