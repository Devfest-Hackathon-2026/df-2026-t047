<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
html,body{width:690px;height:290px}
.win{position:absolute;width:210px;background:#130c20;border:1px solid #3a2758;border-radius:10px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.bar{height:20px;background:#1e1430;display:flex;align-items:center;gap:4px;padding:0 8px;font-size:9px;color:var(--muted)}
.dot{width:6px;height:6px;border-radius:50%;background:#4a3a66}
.li{font-size:10.5px;padding:4px 10px;border-top:1px solid #21173a;color:#d8cdea;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fade{opacity:.45}
.note{position:absolute;width:118px;padding:8px 9px;font-size:11px;font-weight:700;color:#3a2a10;border-radius:3px;box-shadow:0 6px 16px rgba(0,0,0,.5)}
.q{position:absolute;font-size:13px;font-weight:800;color:var(--pink);text-shadow:0 0 12px rgba(255,114,237,.6)}
.tag2{position:absolute;right:10px;bottom:8px;font-size:9.5px;color:#8d76ad;letter-spacing:1px}
</style></head><body>
<div class="win" style="left:14px;top:20px;transform:rotate(-3deg)"><div class="bar"><span class="dot"></span><span class="dot"></span>Aさんの AI チャット</div>

<div class="win" style="left:190px;top:64px;transform:rotate(2deg)"><div class="bar"><span class="dot"></span><span class="dot"></span>Bさんの AI チャット</div>
<div class="li">1. 学食サブスク朝食</div><div class="li">2. 余り食材レシピ投稿</div><div class="li">3. 行列ゼロ事前注文</div><div class="li fade">4. 学食×サークルコラボ</div><div class="li fade">5. …</div></div>
<div class="win" style="left:380px;top:16px;transform:rotate(-1.5deg)"><div class="bar"><span class="dot"></span><span class="dot"></span>Cさんの AI チャット</div>
<div class="li">1. 黒板メニュー共同創作</div><div class="li">2. 重さで払う学食</div><div class="li fade">3. 学食ビンゴ大会（Aと同じ？）</div><div class="li fade">4. …</div></div>
<div class="note" style="left:520px;top:150px;background:#ffd66b;transform:rotate(5deg)">ビンゴ案<br>誰のだっけ？</div>
<div class="note" style="left:70px;top:190px;background:#ff9fd8;transform:rotate(-4deg)">コスト低めって<br>言ってたよね…</div>
<div class="note" style="left:400px;top:200px;background:#b9a4ff;transform:rotate(3deg)">さっきの案<br>どこ行った？</div>

</body></html>
